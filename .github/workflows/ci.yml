name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # Mondays: catch runner image and registry changes.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The codegen tests also syntax-check the generated Node and Python code.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: GOOS=darwin go vet ./...
      - run: go test ./...

  e2e:
    name: e2e (${{ matrix.lang }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [go, node, python, java, csharp]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Runtimes match the minimum versions the generated apps claim to support.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - if: matrix.lang == 'python'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - if: matrix.lang == 'java'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - if: matrix.lang == 'csharp'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test -- ${{ matrix.lang }}
        working-directory: e2e
