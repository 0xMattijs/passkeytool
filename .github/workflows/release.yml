name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the build provenance
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*} arch=${target#*/}
            name=passkeytool_${VERSION#v}_${os}_${arch}
            exe=passkeytool; [ "$os" = windows ] && exe=passkeytool.exe
            mkdir "$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" -o "$name/$exe" .
            cp README.md LICENSE "$name/"
            if [ "$os" = windows ]; then
              zip -qr "dist/$name.zip" "$name"
            else
              tar -czf "dist/$name.tar.gz" "$name"
            fi
          done
          cd dist && sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
