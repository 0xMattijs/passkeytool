name: Feature request
description: Suggest a feature, an option, or a new code generator language.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you're trying to do and why the current tool doesn't cover it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you'd like it to work. For a new language, name the WebAuthn library you'd use.
